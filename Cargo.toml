[workspace]
resolver = "2"
members = [
    "crates/scafra",
    "crates/scafra-core",
    "crates/scafra-foundation",
    "crates/scafra-macros",
    "crates/scafra-actuator",
    "crates/scafra-scheduler",
    "crates/scafra-security",
    "crates/scafra-web",
    "crates/scafra-config",
    "crates/scafra-cli",
    "crates/scafra-build",
    "crates/scafra-bootui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Scafra/Scafra"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
scafra = { path = "crates/scafra", version = "0.1.0" }
scafra-build = { path = "crates/scafra-build", version = "0.1.0" }
scafra-bootui = { path = "crates/scafra-bootui", version = "0.1.0" }
scafra-config = { path = "crates/scafra-config", version = "0.1.0" }
scafra-core = { path = "crates/scafra-core", version = "0.1.0" }
scafra-foundation = { path = "crates/scafra-foundation", version = "0.1.0" }
scafra-macros = { path = "crates/scafra-macros", version = "0.1.0" }
scafra-actuator = { path = "crates/scafra-actuator", version = "0.1.0" }
scafra-scheduler = { path = "crates/scafra-scheduler", version = "0.1.0" }
scafra-security = { path = "crates/scafra-security", version = "0.1.0" }
scafra-web = { path = "crates/scafra-web", version = "0.1.0" }
http = "1"
inventory = "0.3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
