[package]
name = "scafra-async-resource-example"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
scafra = { path = "../../crates/scafra" }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
