[package]
name = "scafra-rustclamp-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

# Experimental: keep RustClamp's higher MSRV
# outside Scafra's workspace.
[workspace]

[dependencies]
scafra = { path = "../../crates/scafra" }
axum = "0.8.9"
rustclamp-core = "1"
rustclamp-http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
